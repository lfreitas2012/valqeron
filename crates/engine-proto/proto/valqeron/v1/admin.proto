syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "valqeron/v1/base.proto";

package valqeron.v1;

message BackgroundTaskDetailProto {
  bytes id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp last_updated_at = 4;
}

// ========================== List Background Tasks ==========================
message ListBackgroundTasksRequestProto {
  PaginatedCursor cursor = 1;
}

message ListBackgroundTasksResponseProto {
  PaginatedCursor cursor = 1;
  uint32 protocol_version = 2;
  repeated BackgroundTaskDetailProto tasks = 3;
}

// ========================== Health ==========================
message HealthRequestProto {}

message HealthResponseProto {
  string engine_version = 1;
  uint32 protocol_version = 2;
}

message StatusRequestProto {}

message StatusResponseProto {
  string engine_version = 1;
  uint32 protocol_version = 2;
  uint32 pid = 5;
}

service RpcAdminService {
  rpc Health(HealthRequestProto) returns (HealthResponseProto);
  rpc Status(StatusRequestProto) returns (StatusResponseProto);
  rpc ListBackgroundTasks(ListBackgroundTasksRequestProto) returns (ListBackgroundTasksResponseProto);
}
