[package]
name = "valqeron-infrastructure"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
version.workspace = true

[dependencies]
valqeron-core = { workspace = true }
ftracker-identifiers = { workspace = true }
rusqlite = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# `loom` is only compiled under `--cfg loom` (see the `sync` shim in `sqlite::driver`).
# Gated as a normal (target-cfg) dependency so both the lib and its tests can see it under the
# flag; with the flag absent it is never pulled into the dependency graph. Run the model tests via:
#   RUSTFLAGS="--cfg loom" cargo test -p valqeron-infrastructure --lib loom_tests
[target.'cfg(loom)'.dependencies]
loom = { workspace = true }

[lints]
workspace = true